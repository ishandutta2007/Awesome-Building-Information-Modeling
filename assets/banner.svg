<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0B0F19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0F172A"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><style>@keyframes pulse{0%{r:4px;opacity:.4}}.bg-grid{stroke:rgba(59,130,246,.08);stroke-width:1}.building-wireframe{stroke:rgba(99,102,241,.25);stroke-width:1.5;fill:none}.node-pulse{animation:pulse 3s infinite alternate ease-in-out}.line-flow{stroke-dasharray:8 8;animation:dash 20s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:38px;fill:#f8fafc}.subtitle-text{font-weight:500;font-size:17px;fill:#94a3b8}.badge-text{font-weight:600;font-size:12px;fill:#38bdf8}</style></defs><rect width="1200" height="320" fill="url(#bgGradient)" rx="12"/><g class="bg-grid"><path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280"/><path d="M 60,0 L 60,320 M 180,0 L 180,320 M 300,0 L 300,320 M 420,0 L 420,320 M 540,0 L 540,320 M 660,0 L 660,320 M 780,0 L 780,320 M 900,0 L 900,320 M 1020,0 L 1020,320 M 1140,0 L 1140,320"/></g><g class="building-wireframe" transform="translate(860, 40)"><polygon stroke="#3B82F6" stroke-opacity=".4" points="120 20 220 70 120 120 20 70"/><polygon stroke="#6366F1" stroke-opacity=".4" points="120 120 220 70 220 190 120 240"/><polygon stroke="#8B5CF6" stroke-opacity=".4" points="120 120 20 70 20 190 120 240"/><line x1="120" x2="120" y1="20" y2="120" stroke="#60A5FA" stroke-opacity=".5"/><polygon stroke="#38BDF8" stroke-dasharray="4 4" stroke-opacity=".3" points="120 160 220 110 120 60 20 110"/><polygon stroke="#38BDF8" stroke-dasharray="4 4" stroke-opacity=".3" points="120 200 220 150 120 100 20 150"/><path stroke="#60A5FA" stroke-width="2" d="M 20,70 L 120,20 L 220,70" class="line-flow"/><path stroke="#EC4899" stroke-width="2" d="M 120,120 L 120,240" class="line-flow"/><circle cx="120" cy="20" r="5" fill="#60A5FA" class="node-pulse"/><circle cx="220" cy="70" r="5" fill="#A855F7" class="node-pulse"/><circle cx="20" cy="70" r="5" fill="#38BDF8" class="node-pulse"/><circle cx="120" cy="120" r="6" fill="#F43F5E" filter="url(#glow)"/><circle cx="120" cy="240" r="5" fill="#3B82F6" class="node-pulse"/></g><rect width="1200" height="5" x="0" y="0" fill="url(#accentGrad)"/><g transform="translate(60, 48)"><rect width="760" height="224" x="0" y="0" fill="#0F172A" fill-opacity=".75" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" filter="url(#cardShadow)" rx="16"/><rect width="230" height="28" x="36" y="32" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="14"/><circle cx="52" cy="46" r="4" fill="#38BDF8"/><text x="64" y="50" class="badge-text">BUILDING INFORMATION MODELING</text><text x="36" y="106" class="title-text">Awesome BIM Ecosystem 🏢✨</text><text x="36" y="146" class="subtitle-text">Curated directory of openBIM IFC engines, 3D web viewers,</text><text x="36" y="170" class="subtitle-text">CDE collaboration software, and AEC construction SaaS.</text><rect width="688" height="2" x="36" y="196" fill="url(#accentGrad)" opacity=".6"/></g></svg>